name: Deploy

# main への push（PRのマージ）で本番 Cloud Run に自動デプロイする。
# CI（ruff/pytest/web build）の成功が前提。失敗時はデプロイしない。
# 手動実行も可（Actions → Deploy → Run workflow）。
# デプロイ先はリポジトリの Variables（GCP_PROJECT_ID・GCP_REGION）で決める。
# GCP_PROJECT_ID が未設定のリポジトリ（fork など）では、デプロイしない。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
  RUNTIME_SA: app-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  IMAGE_REPO: ${{ vars.GCP_REGION || 'asia-northeast1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy/jci-sed-app

jobs:
  deploy:
    name: Cloud Run (production)
    runs-on: ubuntu-latest
    # workflow_run は CI が失敗しても発火するため、成功時のみ進める。
    # branches: [main] は「CI を起こしたブランチ名」でしか絞れず、fork の main ブランチからの
    # PR でも一致してしまう。このリポジトリの main への push で動いた CI だけに限る
    if: >-
      vars.GCP_PROJECT_ID != '' && (
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Workload Identity 連携（鍵レス認証）に必要

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run では CI が動いたコミットを明示的に取得する
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve commit sha
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # 公開リポジトリでは Actions のログを誰でも見られる。gcloud run deploy が表示する
      # サービスの URL（run.app の 2 つの形）を、表示される前に伏せる
      - name: Hide service URLs in logs
        run: |
          for s in jci-sed-agent jci-sed-admin; do
            urls="$(gcloud run services describe "$s" --region "${REGION}" --project "${PROJECT_ID}" \
              --format='value(metadata.annotations."run.googleapis.com/urls")' 2>/dev/null || true)"
            for u in $(echo "${urls}" | tr -d '[]" ' | tr ',' ' '); do
              echo "::add-mask::${u}"
            done
          done

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      # agent / admin は同一イメージ。1回だけビルドして両サービスに配る。
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.sha.outputs.sha }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # 公開サービス（LINE Webhook / tick）。設定は scripts/deploy.sh と同一。
      # 環境変数は --update-env-vars（マージ）にして、手動で足した設定
      # （GCAL_CALENDAR_ID 等）がデプロイのたびに消えないようにする。
      - name: Deploy jci-sed-agent
        run: |
          gcloud run deploy jci-sed-agent \
            --image "${IMAGE_REPO}:${{ steps.sha.outputs.sha }}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --service-account "${RUNTIME_SA}" \
            --set-secrets "LINE_CHANNEL_SECRET=line-channel-secret:latest,LINE_CHANNEL_ACCESS_TOKEN=line-channel-access-token:latest,ADMIN_API_SECRET=admin-api-secret:latest" \
            --update-env-vars "GCP_PROJECT_ID=${PROJECT_ID},TZ=Asia/Tokyo" \
            --allow-unauthenticated \
            --quiet

      # 管理サービス（SPA /app・/api、IAP保護）。
      # ROLE=admin などの既存設定を壊さないよう --image のみ差し替える。
      - name: Deploy jci-sed-admin
        run: |
          gcloud run deploy jci-sed-admin \
            --image "${IMAGE_REPO}:${{ steps.sha.outputs.sha }}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --quiet

      - name: Health check (jci-sed-agent)
        run: |
          URL="$(gcloud run services describe jci-sed-agent \
            --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')"
          # 公開リポジトリでは Actions のログを誰でも見られる。URL はログに出さない
          echo "::add-mask::${URL}"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${URL}/health"

      - name: Summary
        run: |
          {
            echo "### デプロイ完了"
            echo ""
            echo "- commit: \`${{ steps.sha.outputs.sha }}\`"
            echo "- image: \`${IMAGE_REPO}:${{ steps.sha.outputs.sha }}\`"
            for s in jci-sed-agent jci-sed-admin; do
              rev="$(gcloud run services describe "$s" --region "${REGION}" \
                --project "${PROJECT_ID}" --format='value(status.latestReadyRevisionName)')"
              echo "- ${s}: \`${rev}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
